    #   league: "Atletico Madrid"
    #   type: "club"
    # - url: "https://www.newsnow.co.uk/h/Sport/Football/Bundesliga/Bayern+Munich?type=ln"
    #   league: "Bayern Munich"
    #   type: "club"
    # - url: "https://www.newsnow.co.uk/h/Sport/Football/Bundesliga/Borussia+Dortmund?type=ln"
    #   league: "Borussia Dortmund"
    #   type: "club"
    # - url: "https://www.newsnow.co.uk/h/Sport/Football/Premier+League/Manchester+United?type=ln"
